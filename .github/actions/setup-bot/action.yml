# yaml-language-server: $schema=https://www.schemastore.org/github-action.json
name: "Setup Chitrank Bot"
description: "Generates a GitHub App token for automated tasks"
inputs:
  client-id:
    description: "The GitHub App Client ID"
    required: true
  private-key:
    description: "The GitHub App Private Key"
    required: true
  permission-contents:
    description: "Repository contents permission for the generated token"
    required: true
  permission-workflows:
    description: "Workflow permission needed when anchoring release tags"
    required: false
  permission-issues:
    description: "Repository issues permission for the generated token"
    required: false
  permission-pull-requests:
    description: "Repository pull requests permission for the generated token"
    required: false
outputs:
  token:
    description: "The generated GitHub App token"
    value: ${{ steps.generate_token.outputs.token }}
runs:
  using: "composite"
  steps:
    - name: Create Bot Token 🤖🔑
      id: generate_token
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.private-key }}
        permission-contents: ${{ inputs.permission-contents }}
        permission-workflows: ${{ inputs.permission-workflows }}
        permission-issues: ${{ inputs.permission-issues }}
        permission-pull-requests: ${{ inputs.permission-pull-requests }}
