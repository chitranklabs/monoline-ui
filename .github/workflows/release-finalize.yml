name: Release 2 - Finalize Tag 🏷️

# Builds one verified release candidate, publishes npm and JSR independently,
# and exposes targeted recovery without republishing successful registries.

on:
  pull_request:
    types:
      - closed
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Existing release tag to recover (e.g. v0.5.0)"
        required: true
      target:
        description: "Release surface to run."
        type: choice
        required: true
        default: all
        options: [all, npm, jsr, github-release]
      jsr_provenance:
        description: "Disable only to recover from a confirmed upstream provenance outage."
        type: choice
        required: true
        default: required
        options: [required, disabled-for-recovery]

concurrency:
  # Unrelated closed PRs must not replace a pending release run.
  group: library-release-finalize
  cancel-in-progress: false

permissions: {}

env:
  NODE_VERSION: 24
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build & Prepare 🏗️
    if: |
      (github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'release')) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor == 'chitrank2050')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      tag_name: ${{ steps.vars.outputs.tag_name }}
      release_sha: ${{ steps.vars.outputs.release_sha }}
    steps:
      - name: Harden Runner 🛡️
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository 📥
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.event.pull_request.merge_commit_sha }}

      - name: Create Bot Token 🤖🔑
        id: generate_token
        uses: $/.github/actions/setup-bot
        with:
          client-id: ${{ secrets.CHITRANK_BOT_CLIENT_ID }}
          private-key: ${{ secrets.CHITRANK_BOT_PRIVATE_KEY }}
          permission-contents: write

      - name: Setup Publishing Environment 🛠️
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.18.0
          run_install: false

      - name: Setup Node.js 🟢
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      - name: Install dependencies 📥
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Verify prepared release identity
        id: vars
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: node scripts/release-verify.mjs

      - name: Run static quality checks ✅
        run: pnpm run check:static

      - name: Verify release belongs to main
        run: git merge-base --is-ancestor HEAD origin/main

      - name: Verify published package contracts 📦
        run: pnpm run check:package

      - name: Build production documentation 🏗️
        run: pnpm run build

      - name: Setup Deno for publication preflight
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.6

      - name: Validate JSR publication before tagging
        working-directory: packages/ui
        run: deno publish --dry-run --allow-slow-types

      - name: Verify release checks left source unchanged
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Release verification changed tracked or untracked source."
            git status --porcelain
            exit 1
          fi

      - name: Pack verified release candidate
        run: |
          mkdir -p release-artifacts
          pnpm --dir packages/ui/dist pack --out "$GITHUB_WORKSPACE/release-artifacts/monoline.tgz"

      - name: Attest release candidate
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-artifacts/monoline.tgz

      - name: Upload Build Artifacts 📦
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-output
          path: |
            packages/ui/dist/
            package.json
            packages/ui/jsr.json
            packages/ui/CHANGELOG.md
            release-artifacts/
          if-no-files-found: error
          retention-days: 10

  tag:
    name: Anchor Release Tag 🏷️
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden Runner 🛡️
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.release_sha }}
          persist-credentials: false

      - name: Create Bot Token 🤖🔑
        id: generate_token
        uses: $/.github/actions/setup-bot
        with:
          client-id: ${{ secrets.CHITRANK_BOT_CLIENT_ID }}
          private-key: ${{ secrets.CHITRANK_BOT_PRIVATE_KEY }}
          permission-contents: write

      - name: Push Verified Tag 🏷️
        env:
          GH_TOKEN: ${{ steps.generate_token.outputs.token }}
          TAG_NAME: ${{ needs.build.outputs.tag_name }}
        run: |
          git config user.name "chitrank-actions[bot]"
          git config user.email "actions@github.com"
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}
          HEAD_SHA="$(git rev-parse HEAD)"
          if git rev-parse -q --verify "refs/tags/$TAG_NAME" >/dev/null; then
            TAG_SHA="$(git rev-list -n 1 "$TAG_NAME")"
            if [ "$TAG_SHA" != "$HEAD_SHA" ]; then
              echo "❌ Tag $TAG_NAME already exists at $TAG_SHA, expected $HEAD_SHA"
              exit 1
            fi
            echo "Tag $TAG_NAME already exists at the current commit"
          else
            git tag "$TAG_NAME"
          fi
          git push origin "$TAG_NAME"

  publish-npm:
    name: Publish to NPM 📦
    needs: [build, tag]
    if: |
      github.event_name != 'workflow_dispatch' ||
      inputs.target == 'all' ||
      inputs.target == 'npm'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Harden Runner 🛡️
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.release_sha }}
          persist-credentials: false

      - name: Download Build Artifacts 📥
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-output

      - name: Setup Publishing Environment 🛠️
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.18.0
          run_install: false

      - name: Setup Node.js 🟢
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"

      - name: Require NPM publishing credential
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::NPM_TOKEN is required until npm trusted publishing is configured."
            exit 1
          fi

      - name: Publish to NPM 📦
        env:
          RELEASE_TAG: ${{ needs.build.outputs.tag_name }}
        run: node scripts/release-registry.mjs publish-npm

  publish-jsr:
    name: Publish to JSR 🦖
    needs: [build, tag]
    if: |
      github.event_name != 'workflow_dispatch' ||
      inputs.target == 'all' ||
      inputs.target == 'jsr'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden Runner 🛡️
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository 📥
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.build.outputs.release_sha }}

      - name: Setup Publishing Environment 🛠️
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.18.0
          run_install: false

      - name: Setup Node.js 🟢
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies 🛠️
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Setup Deno 🦕
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.6

      - name: Verify JSR Version 🔄
        run: |
          PACKAGE_VERSION="$(jq -r .version packages/ui/package.json)"
          JSR_VERSION="$(jq -r .version packages/ui/jsr.json)"
          if [ "$PACKAGE_VERSION" != "$JSR_VERSION" ]; then
            echo "::error::package.json ($PACKAGE_VERSION) and packages/ui/jsr.json ($JSR_VERSION) versions differ."
            exit 1
          fi

      - name: Publish to JSR 📦
        env:
          RELEASE_TAG: ${{ needs.build.outputs.tag_name }}
          JSR_PROVENANCE: ${{ inputs.jsr_provenance || 'required' }}
        run: |
          PUBLISH_ARGS=(--config packages/ui/jsr.json --allow-slow-types)
          if [ "$JSR_PROVENANCE" = "disabled-for-recovery" ]; then
            [ "${{ github.event_name }}" = "workflow_dispatch" ] || exit 1
            PUBLISH_ARGS+=(--no-provenance)
            echo "::warning::JSR provenance explicitly disabled for recovery"
          fi
          if node scripts/release-registry.mjs jsr-exists; then
            echo "JSR version is already published."
          else
            status=$?
            [ "$status" -eq 1 ] || exit "$status"
            deno publish "${PUBLISH_ARGS[@]}"
          fi
          node scripts/release-registry.mjs verify-jsr

  create-release:
    name: Create Verified GitHub Release ✨
    needs:
      - build
      - tag
      - publish-npm
      - publish-jsr
    if: |
      always() &&
      needs.build.result == 'success' &&
      needs.tag.result == 'success' &&
      (github.event_name != 'workflow_dispatch' ||
      inputs.target == 'all' ||
      inputs.target == 'github-release') &&
      (needs.publish-npm.result == 'success' || needs.publish-npm.result == 'skipped') &&
      (needs.publish-jsr.result == 'success' || needs.publish-jsr.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden Runner 🛡️
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository 📥
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.build.outputs.release_sha }}

      - name: Download Build Artifacts 📥
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-output

      - name: Create Bot Token 🤖🔑
        id: generate_token
        uses: $/.github/actions/setup-bot
        with:
          client-id: ${{ secrets.CHITRANK_BOT_CLIENT_ID }}
          private-key: ${{ secrets.CHITRANK_BOT_PRIVATE_KEY }}
          permission-contents: write

      - name: Setup Node.js 🟢
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Create GitHub Release ✨
        env:
          GH_TOKEN: ${{ steps.generate_token.outputs.token }}
          TAG_NAME: ${{ needs.build.outputs.tag_name }}
          INPUT_VERSION: ${{ needs.build.outputs.tag_name }}
          RELEASE_TAG: ${{ needs.build.outputs.tag_name }}
        run: |
          node scripts/release-verify.mjs
          node scripts/release-registry.mjs verify-npm
          node scripts/release-registry.mjs verify-jsr
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            mkdir -p "$RUNNER_TEMP/published-assets"
            gh release download "$TAG_NAME" --pattern monoline.tgz --dir "$RUNNER_TEMP/published-assets"
            cmp release-artifacts/monoline.tgz "$RUNNER_TEMP/published-assets/monoline.tgz"
            echo "Verified existing release $TAG_NAME."
          else
            gh release create "$TAG_NAME" --verify-tag --title "$TAG_NAME" --notes-file "$RUNNER_TEMP/release-notes.md" release-artifacts/monoline.tgz
          fi

  release-summary:
    name: Release Summary 📋
    needs: [build, tag, publish-npm, publish-jsr, create-release]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Write recovery summary
        env:
          TAG: ${{ needs.build.outputs.tag_name }}
          BUILD: ${{ needs.build.result }}
          TAG_JOB: ${{ needs.tag.result }}
          NPM: ${{ needs.publish-npm.result }}
          JSR: ${{ needs.publish-jsr.result }}
          GITHUB_RELEASE: ${{ needs.create-release.result }}
        run: |
          {
            echo "## Release ${TAG:-unresolved}"
            echo "| Surface | Result |"
            echo "| --- | --- |"
            echo "| Build candidate | $BUILD |"
            echo "| Git tag | $TAG_JOB |"
            echo "| npm | $NPM |"
            echo "| JSR | $JSR |"
            echo "| GitHub Release | $GITHUB_RELEASE |"
            echo
            echo "Use **Re-run failed jobs** for an immediate retry."
            echo "For targeted recovery, dispatch this workflow with the same version and failed target."
          } >> "$GITHUB_STEP_SUMMARY"
