name: CI 🌊

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".vscode/**"
      - ".editorconfig"
      - "cliff.toml"
      - "lefthook.yml"
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions: {}

jobs:
  changes:
    name: Detect Changes 🔍
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      library: ${{ steps.filter.outputs.library }}
      docs: ${{ steps.filter.outputs.docs }}
      deps: ${{ steps.filter.outputs.deps }}
      lint: ${{ steps.filter.outputs.lint }}
      code: ${{ steps.filter.outputs.code }}
      markdown: ${{ steps.filter.outputs.markdown }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - name: Harden Runner 🛡️
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout 📥
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Classify changed paths
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            library:
              # Shared build settings and pipeline edits must exercise the jobs they affect.
              - 'tsconfig.json'
              - '.github/workflows/ci.yml'
              - '.github/workflows/release-finalize.yml'
              - 'packages/ui/src/**'
              - 'packages/ui/tsconfig.json'
              - 'packages/ui/package.json'
              - 'packages/ui/jsr.json'
              - 'packages/ui/tsup.config.ts'
              - 'packages/ui/tsconfig.build.json'
              - 'scripts/build-lib.mjs'
              - 'scripts/package-contract-test.mjs'
              - 'scripts/react-18-compatibility-test.mjs'
              - 'scripts/sync-exports.mjs'
              - 'scripts/lib/**'
            docs:
              - 'apps/website/next-env.d.ts'
              - 'apps/website/tsconfig.json'
              - 'apps/website/proxy.ts'
              - 'apps/website/vercel.json'
              - 'apps/website/app/**'
              - 'apps/website/public/**'
              - 'e2e/**'
              - 'apps/website/next.config.ts'
              - 'playwright.config.ts'
              - 'apps/website/postcss.config.mjs'
              - 'scripts/run-docs-integration.mjs'
              - 'scripts/seo-integration-test.mjs'
            deps:
              - 'package.json'
              - 'packages/*/package.json'
              - 'apps/*/package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            lint:
              - 'scripts/**'
              - 'eslint.config.mjs'
              - 'tsconfig.json'
              - 'vitest.config.ts'
              - '.prettierrc.json'
              - '.prettierignore'
              - '.markdownlint.json'
              - '.markdownlint-cli2.*'
              - '.github/**'
              - 'lefthook.yml'
            code:
              - 'scripts/**'
              - 'tests/**'
              - '*.{ts,tsx,js,jsx,mjs,cjs,mts,cts}'
            workflows:
              - '.github/workflows/**'
              - '.github/actions/**'
            markdown:
              - '**/*.md'

  quality:
    name: Hygiene & Security 🧼🛡️
    needs: changes
    if: |
      needs.changes.outputs.library == 'true' ||
      needs.changes.outputs.docs == 'true' ||
      needs.changes.outputs.deps == 'true' ||
      needs.changes.outputs.lint == 'true' ||
      needs.changes.outputs.code == 'true' ||
      needs.changes.outputs.markdown == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden Runner 🛡️
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout 📥
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm 📦
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js 🟢
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies 🛠️
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Verify generated exports
        if: needs.changes.outputs.library == 'true' || needs.changes.outputs.deps == 'true'
        run: pnpm sync-exports:check

      - name: Check formatting
        run: pnpm format:check

      - name: Verify CI selection contracts
        run: pnpm test:ci

      - name: Lint code
        if: |
          needs.changes.outputs.library == 'true' ||
          needs.changes.outputs.docs == 'true' ||
          needs.changes.outputs.deps == 'true' ||
          needs.changes.outputs.code == 'true'
        run: pnpm exec eslint .

      - name: Lint Markdown
        run: pnpm lint:md

      - name: Typecheck
        # Prose/format-only edits still report this job, but avoid unrelated code checks.
        if: |
          needs.changes.outputs.library == 'true' ||
          needs.changes.outputs.docs == 'true' ||
          needs.changes.outputs.deps == 'true' ||
          needs.changes.outputs.code == 'true'
        run: pnpm typecheck

      - name: Run unit tests
        if: |
          needs.changes.outputs.library == 'true' ||
          needs.changes.outputs.docs == 'true' ||
          needs.changes.outputs.deps == 'true' ||
          needs.changes.outputs.code == 'true'
        run: pnpm test

      - name: Verify checks are read-only
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Checks changed tracked or generated files."
            git status --porcelain
            exit 1
          fi

  package_contract:
    name: Package Contract 📦
    needs: changes
    if: needs.changes.outputs.library == 'true' || needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden Runner 🛡️
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout 📥
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm 📦
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Setup Node.js 🟢
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies 🛠️
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Verify published package contracts
        run: pnpm check:package
      - name: Verify package checks are read-only
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Package verification changed the workspace."
            git status --porcelain
            exit 1
          fi

  docs_integration:
    name: Production Docs & Accessibility 🌐
    needs: changes
    if: needs.changes.outputs.docs == 'true' || needs.changes.outputs.library == 'true' || needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Harden Runner 🛡️
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout 📥
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm 📦
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Setup Node.js 🟢
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Restore Next.js build cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.0.3
        with:
          path: apps/website/.next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/website/app/**/*', 'packages/ui/src/**/*', 'apps/website/public/**/*', 'apps/website/next.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-next-
      - name: Install dependencies 🛠️
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Install Chromium 🌐
        # Both browser projects use the default headless shell, not a Chromium channel.
        run: pnpm exec playwright install --with-deps --only-shell chromium
      - name: Build production documentation
        run: pnpm build
      - name: Test production documentation
        run: pnpm test:docs:built
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  dependency_scan:
    name: Dependency Scan 🔍
    needs: changes
    if: needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden Runner 🛡️
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout 📥
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install OSV Scanner
        run: |
          OSV_VERSION="2.3.8"
          OSV_BIN="$RUNNER_TEMP/osv-scanner"
          curl -sSfL "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64" -o "$OSV_BIN"
          echo "bc98e15319ed0d515e3f9235287ba53cdc5535d576d24fd573978ecfe9ab92dc  $OSV_BIN" | sha256sum -c -
          chmod +x "$OSV_BIN"
          "$OSV_BIN" --lockfile=pnpm-lock.yaml

  secret_scan:
    name: Secret Scan 🔑
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden Runner 🛡️
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout 📥
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Gitleaks 🕵️
        run: |
          GITLEAKS_VERSION="8.27.2"
          GITLEAKS_ARCHIVE="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o "$GITLEAKS_ARCHIVE"
          echo "141c3b2dede46d8b3a53b47116da756bd223decc0374797559a6b50ecba5590c  $GITLEAKS_ARCHIVE" | sha256sum -c -
          tar -xzf "$GITLEAKS_ARCHIVE" -C "$RUNNER_TEMP" gitleaks
          chmod +x "$RUNNER_TEMP/gitleaks"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Run Gitleaks 🕵️
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        run: gitleaks detect --source . --verbose --redact

  workflow_security:
    name: Run zizmor 🌈
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden Runner 🛡️
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout 📥
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install zizmor
        run: pipx install zizmor==1.29.0
      - name: Audit workflow security
        run: zizmor --offline .

  ci_gate:
    name: CI Gate 🚦
    if: always()
    needs:
      - changes
      - quality
      - package_contract
      - docs_integration
      - dependency_scan
      - secret_scan
      - workflow_security
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require successful applicable jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "::error::A required CI job finished with: $result"
              exit 1
            fi
          done
