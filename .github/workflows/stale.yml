name: Stale Issues Closer ⏰

on:
  schedule:
    - cron: "30 1 * * *" # Every day at 01:30 UTC

concurrency:
  group: stale-maintenance
  cancel-in-progress: false

permissions: {}

jobs:
  stale:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Harden Runner 🛡️
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: "This issue is stale because it has been open 45 days with no activity."
          stale-pr-message: "This PR is stale because it has been open 45 days with no activity."
          exempt-pr-labels: "release"
          days-before-stale: 45
          days-before-close: 7
