name: Release 1 - Prepare PR 📝

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Manual tag to release (e.g. v0.1.0). Leave empty to use git-hygiene recommendation."
        required: false

jobs:
  prepare:
    name: Prepare Release PR 🚀
    if: github.actor == github.repository_owner || github.actor == 'chitrank2050'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      NODE_VERSION: 24
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Harden Runner 🛡️
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout repository 📥
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Publishing Environment 🛠️
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js 🟢
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies 📥
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Get Recommended Bump 🌊
        id: bump
        if: github.event.inputs.tag_name == ''
        uses: chitranklabs/git-hygiene@22783c72540d66e1b851295d1961c19b6db81856 # v0.4.12
        with:
          command: "bump"

      - name: Create Bot Token 🤖🔑
        id: generate_token
        uses: ./.github/actions/setup-bot
        with:
          client-id: ${{ secrets.CHITRANK_BOT_CLIENT_ID }}
          private-key: ${{ secrets.CHITRANK_BOT_PRIVATE_KEY }}

      - name: Configure Authenticated Git 🔧
        env:
          TOKEN: ${{ steps.generate_token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          git remote set-url origin "https://x-access-token:${TOKEN}@github.com/${REPO}"

      - name: Determine New Version 🔢
        id: vars
        env:
          MANUAL_TAG: ${{ github.event.inputs.tag_name }}
          BUMP: ${{ steps.bump.outputs.releaseType }}
        run: |
          CURRENT_VERSION=$(jq -r .version package.json)
          RAW_INPUT="${MANUAL_TAG}"

          if [ -n "$RAW_INPUT" ]; then
            NEW_VERSION=$(echo "$RAW_INPUT" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+(-.*)?' | head -1)
            if [[ ! "$NEW_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-.*)?$ ]]; then
              echo "❌ Error: Could not extract valid version from '$RAW_INPUT'"
              exit 1
            fi
          else
            NEW_VERSION=$(node -e "
              const semver = '$CURRENT_VERSION'.split('.').map(Number);
              const type = '$BUMP';
              if (type === 'major') semver[0]++, semver[1] = 0, semver[2] = 0;
              else if (type === 'minor') semver[1]++, semver[2] = 0;
              else semver[2]++;
              console.log(semver.join('.'));
            ")
          fi

          echo "clean_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag_name=v$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Sync Version 📦
        env:
          CLEAN_VERSION: ${{ steps.vars.outputs.clean_version }}
        run: |
          jq ".version = \"$CLEAN_VERSION\"" package.json > package.json.tmp && mv package.json.tmp package.json
          jq ".version = \"$CLEAN_VERSION\"" package.json.lib > package.json.lib.tmp && mv package.json.lib.tmp package.json.lib
          jq ".version = \"$CLEAN_VERSION\"" jsr.json > jsr.json.tmp && mv jsr.json.tmp jsr.json

      - name: Update CHANGELOG.md 📝
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4.8.0
        id: git-cliff
        with:
          config: cliff.toml
          args: --tag ${{ steps.vars.outputs.tag_name }} --output CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}

      - name: Update app/lib/changelog.json 📄
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4.8.0
        with:
          config: cliff.toml
          args: --context --tag ${{ steps.vars.outputs.tag_name }} --output app/lib/changelog.json
        env:
          GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}

      - name: Format generated files 🧹
        run: |
          pnpm exec prettier --write package.json jsr.json CHANGELOG.md app/lib/changelog.json
          pnpm exec prettier --write --parser json package.json.lib

      - name: Generate PR Body 📝
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4.8.0
        id: git-cliff-pr
        with:
          config: cliff.toml
          args: --unreleased --tag ${{ steps.vars.outputs.tag_name }} --strip header
        env:
          GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}

      - name: Create Pull Request for Release 🔀
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.generate_token.outputs.token }}
          commit-message: "chore(release): bump version to ${{ steps.vars.outputs.tag_name }}"
          title: "chore(release): 🚀 ${{ steps.vars.outputs.tag_name }}"
          branch: "chore/release-${{ steps.vars.outputs.tag_name }}"
          body: |
            ## 📦 Release ${{ steps.vars.outputs.tag_name }}

            <!-- autofill-start -->
            ${{ steps.git-cliff-pr.outputs.content }}
            <!-- autofill-end -->

            ---
            - **Bump Strategy**: ${{ github.event.inputs.tag_name != '' && 'Manual Override' || format('git-hygiene recommendation ({0})', steps.bump.outputs.releaseType) }}
          labels: |
            chore
            release
          base: main
          delete-branch: true
          assignees: chitrank2050
          add-paths: |
            CHANGELOG.md
            app/lib/changelog.json
            package.json
            package.json.lib
            jsr.json
