name: UI Release 1 - Prepare PR

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-prepare
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare Release PR 🚀
    if: github.ref == 'refs/heads/main' && (github.actor == github.repository_owner || github.actor == 'chitrank2050')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      NODE_VERSION: 24
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Harden Runner 🛡️
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout repository 📥
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Publishing Environment 🛠️
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.28.10
          run_install: false

      - name: Setup Node.js 🟢
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies 📥
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Prepare Changesets release
        id: vars
        run: pnpm release:version

      - name: Format release files
        if: steps.vars.outputs.release_ready == 'true'
        run: |
          pnpm install --lockfile-only --ignore-scripts --prefer-offline
          pnpm exec prettier --write packages/ui/package.json packages/ui/jsr.json packages/ui/CHANGELOG.md apps/website/app/lib/changelog.json

      - name: Create Bot Token 🤖🔑
        id: generate_token
        if: steps.vars.outputs.release_ready == 'true'
        uses: $/.github/actions/setup-bot
        with:
          client-id: ${{ secrets.CHITRANK_BOT_CLIENT_ID }}
          private-key: ${{ secrets.CHITRANK_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create Pull Request for Release 🔀
        id: cpr
        if: steps.vars.outputs.release_ready == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.generate_token.outputs.token }}
          commit-message: "release(monoline-ui): bump version to ${{ steps.vars.outputs.tag_name }}"
          title: "release(monoline-ui): prepare ${{ steps.vars.outputs.tag_name }}"
          branch: "release/${{ steps.vars.outputs.tag_name }}"
          body-path: ${{ runner.temp }}/ui-release-pr.md
          labels: |
            release
            pkg/ui
          base: main
          delete-branch: true
          assignees: chitrank2050
          add-paths: |
            .changeset/*.md
            packages/ui/package.json
            packages/ui/jsr.json
            packages/ui/CHANGELOG.md
            apps/website/app/lib/changelog.json
            pnpm-lock.yaml
