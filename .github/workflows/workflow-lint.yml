# =============================================================
# Workflow Linting - Security Audit for GitHub Actions
#
# Uses zizmor to scan all workflows in .github/workflows/
# for security misconfigurations, overly broad permissions,
# and potential injection vulnerabilities.
# =============================================================

name: GitHub Actions Security Analysis with zizmor 🌈

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/**"
  pull_request:
    branches: ["main"]

permissions: {}

jobs:
  zizmor:
    name: Run zizmor 🌈
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden Runner 🛡️
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout repository 📥
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Check if workflows changed 🔍
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            workflows:
              - '.github/workflows/**'
              - '.github/actions/**'

      - name: Install zizmor 🌈
        if: github.event_name == 'push' || steps.filter.outputs.workflows == 'true'
        run: pipx install zizmor==1.24.1

      - name: Run zizmor 🌈
        if: github.event_name == 'push' || steps.filter.outputs.workflows == 'true'
        run: zizmor --offline .
