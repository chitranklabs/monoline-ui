name: Docs Release 2 - Finalize Tag 🏷️

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Existing Docs tag to recover (for example docs-v0.1.0)"
        required: true
      target:
        description: "Release surface to run"
        type: choice
        required: true
        default: all
        options: [all, npm, github-release]

permissions: {}

concurrency:
  group: docs-release-finalize
  cancel-in-progress: false

env:
  NODE_VERSION: 24
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build Docs Candidate 🏗️
    if: |
      (github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'chore/docs-release-docs-v')) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor == 'chitrank2050')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      tag_name: ${{ steps.vars.outputs.tag_name }}
      release_sha: ${{ steps.vars.outputs.release_sha }}
    steps:
      - name: Harden Runner 🛡️
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout verified source 📥
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.pull_request.merge_commit_sha }}
      - name: Setup pnpm 📦
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.18.0
          run_install: false
      - name: Setup Node.js 🟢
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - name: Install dependencies 📥
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Verify prepared Docs release
        id: vars
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: node scripts/docs-release.mjs verify
      - name: Verify Docs package ✅
        run: |
          pnpm --filter @chitrank2050/monoline-docs typecheck
          pnpm exec vitest run packages/docs
          pnpm --filter @chitrank2050/monoline-docs test:consumer
      - name: Verify checks are read-only
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Release verification changed source files."
            git status --porcelain
            exit 1
          fi
      - name: Pack release candidate 📦
        run: |
          mkdir -p release-artifacts
          pnpm --dir packages/docs pack --out "$GITHUB_WORKSPACE/release-artifacts/monoline-docs.tgz"
      - name: Attest release candidate
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-artifacts/monoline-docs.tgz
      - name: Upload release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-release-output
          path: |
            packages/docs/package.json
            packages/docs/CHANGELOG.md
            release-artifacts/monoline-docs.tgz
          if-no-files-found: error
          retention-days: 10

  tag:
    name: Anchor Docs Tag 🏷️
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden Runner 🛡️
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.build.outputs.release_sha }}
      - name: Create Bot Token 🤖🔑
        id: generate_token
        uses: $/.github/actions/setup-bot
        with:
          client-id: ${{ secrets.CHITRANK_BOT_CLIENT_ID }}
          private-key: ${{ secrets.CHITRANK_BOT_PRIVATE_KEY }}
          permission-contents: write
      - name: Push verified tag
        env:
          GH_TOKEN: ${{ steps.generate_token.outputs.token }}
          TAG_NAME: ${{ needs.build.outputs.tag_name }}
        run: |
          git config user.name "chitrank-actions[bot]"
          git config user.email "actions@github.com"
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}
          HEAD_SHA="$(git rev-parse HEAD)"
          if git rev-parse -q --verify "refs/tags/$TAG_NAME" >/dev/null; then
            TAG_SHA="$(git rev-list -n 1 "$TAG_NAME")"
            if [ "$TAG_SHA" != "$HEAD_SHA" ]; then
              echo "::error::Tag $TAG_NAME already exists at another commit."
              exit 1
            fi
          else
            git tag "$TAG_NAME"
          fi
          git push origin "$TAG_NAME"

  publish-npm:
    name: Publish Docs to npm 📦
    needs: [build, tag]
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'npm'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Harden Runner 🛡️
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.build.outputs.release_sha }}
      - name: Download release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs-release-output
      - name: Setup Node.js 🟢
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
      - name: Require npm credential
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::NPM_TOKEN is required until trusted publishing is configured."
            exit 1
          fi
      - name: Publish verified candidate
        env:
          RELEASE_TAG: ${{ needs.build.outputs.tag_name }}
        run: node scripts/docs-release.mjs publish-npm

  create-release:
    name: Create Docs GitHub Release ✨
    needs: [build, tag, publish-npm]
    if: |
      always() &&
      needs.build.result == 'success' &&
      needs.tag.result == 'success' &&
      (github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'github-release') &&
      (needs.publish-npm.result == 'success' || needs.publish-npm.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden Runner 🛡️
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.build.outputs.release_sha }}
      - name: Download release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs-release-output
      - name: Create Bot Token 🤖🔑
        id: generate_token
        uses: $/.github/actions/setup-bot
        with:
          client-id: ${{ secrets.CHITRANK_BOT_CLIENT_ID }}
          private-key: ${{ secrets.CHITRANK_BOT_PRIVATE_KEY }}
          permission-contents: write
      - name: Create or verify GitHub release
        env:
          GH_TOKEN: ${{ steps.generate_token.outputs.token }}
          TAG_NAME: ${{ needs.build.outputs.tag_name }}
          INPUT_VERSION: ${{ needs.build.outputs.tag_name }}
          RELEASE_TAG: ${{ needs.build.outputs.tag_name }}
        run: |
          node scripts/docs-release.mjs verify
          node scripts/docs-release.mjs verify-npm
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            mkdir -p "$RUNNER_TEMP/published-docs"
            gh release download "$TAG_NAME" --pattern monoline-docs.tgz --dir "$RUNNER_TEMP/published-docs"
            cmp release-artifacts/monoline-docs.tgz "$RUNNER_TEMP/published-docs/monoline-docs.tgz"
          else
            gh release create "$TAG_NAME" --verify-tag --title "Monoline Docs ${TAG_NAME#docs-}" --notes-file "$RUNNER_TEMP/docs-release-notes.md" release-artifacts/monoline-docs.tgz
          fi

  release-summary:
    name: Docs Release Summary 📋
    needs: [build, tag, publish-npm, create-release]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Write recovery summary
        env:
          TAG: ${{ needs.build.outputs.tag_name }}
          BUILD: ${{ needs.build.result }}
          TAG_JOB: ${{ needs.tag.result }}
          NPM: ${{ needs.publish-npm.result }}
          GITHUB_RELEASE: ${{ needs.create-release.result }}
        run: |
          {
            echo "## Docs release ${TAG:-unresolved}"
            echo "| Surface | Result |"
            echo "| --- | --- |"
            echo "| Build candidate | $BUILD |"
            echo "| Git tag | $TAG_JOB |"
            echo "| npm | $NPM |"
            echo "| GitHub Release | $GITHUB_RELEASE |"
          } >> "$GITHUB_STEP_SUMMARY"
