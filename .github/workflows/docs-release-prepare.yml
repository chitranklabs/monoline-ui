name: Docs Release 1 - Prepare PR

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: docs-release-prepare
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare Docs Release PR 🚀
    if: github.ref == 'refs/heads/main' && (github.actor == github.repository_owner || github.actor == 'chitrank2050')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden Runner 🛡️
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - name: Checkout repository 📥
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup pnpm 📦
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.28.10
          run_install: false
      - name: Setup Node.js 🟢
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies 📥
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Prepare Docs Changesets release
        id: vars
        run: node scripts/docs-release.mjs prepare
      - name: Format release files
        if: steps.vars.outputs.release_ready == 'true'
        run: |
          pnpm install --lockfile-only --ignore-scripts --prefer-offline
          pnpm exec prettier --write packages/docs/package.json packages/docs/CHANGELOG.md
      - name: Create Bot Token 🤖🔑
        id: generate_token
        if: steps.vars.outputs.release_ready == 'true'
        uses: $/.github/actions/setup-bot
        with:
          client-id: ${{ secrets.CHITRANK_BOT_CLIENT_ID }}
          private-key: ${{ secrets.CHITRANK_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Create Docs Release PR 🔀
        if: steps.vars.outputs.release_ready == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.generate_token.outputs.token }}
          commit-message: "release(monoline-docs): prepare ${{ steps.vars.outputs.tag_name }}"
          title: "release(monoline-docs): prepare ${{ steps.vars.outputs.tag_name }}"
          branch: "release/${{ steps.vars.outputs.tag_name }}"
          body-path: ${{ runner.temp }}/docs-release-pr.md
          labels: |
            release
            pkg/docs
          base: main
          delete-branch: true
          assignees: chitrank2050
          add-paths: |
            .changeset/*.md
            packages/docs/package.json
            packages/docs/CHANGELOG.md
            pnpm-lock.yaml
