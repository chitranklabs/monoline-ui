# Labeler Configuration (v5 Syntax)
# -------------------------------------------------------------
# Keys represent the label names in GitHub.
# Values represent the file patterns to match.

# 📦 Workspace Packages & Applications
"pkg/ui":
  - changed-files:
      - any-glob-to-any-file:
          - "packages/ui/**"

"pkg/docs":
  - changed-files:
      - any-glob-to-any-file:
          - "packages/docs/**"

"app/website":
  - changed-files:
      - any-glob-to-any-file:
          - "apps/website/**"

# 🌐 Cross-Cutting Areas
"area/docs":
  - changed-files:
      - any-glob-to-any-file:
          - "docs/**"
          - "*.md"

"area/ci":
  - changed-files:
      - any-glob-to-any-file:
          - ".github/workflows/**"
          - ".github/actions/**"
          - "lefthook.yml"

"area/deps":
  - changed-files:
      - any-glob-to-any-file:
          - "package.json"
          - "packages/*/package.json"
          - "apps/*/package.json"
          - "pnpm-lock.yaml"
          - "pnpm-workspace.yaml"

"area/security":
  - changed-files:
      - any-glob-to-any-file:
          - "SECURITY.md"
          - ".gitleaks.toml"
          - ".github/workflows/scorecard.yml"
          - ".github/workflows/workflow-lint.yml"

"area/maintenance":
  - any:
      - changed-files:
          - any-glob-to-any-file:
              - "scripts/**"
              - ".editorconfig"
              - ".gitignore"
              - ".prettierrc.json"
              - ".markdownlint.json"
              - "tsconfig.json"
              - "packages/*/tsconfig*.json"
              - "apps/*/tsconfig*.json"
              - "packages/*/tsup.config.ts"
              - "eslint.config.mjs"
              - "apps/*/postcss.config.mjs"
              - "cliff.toml"
      - head-branch:
          - "^maintenance/.*"
