packages:
  - "packages/*"
  - "apps/*"

allowBuilds:
  esbuild: true
  lefthook: true
  msw: false
  sharp: true

# First-party release verified against the immutable v0.5.1 action tag.
# Remove these entries after the minimum-release-age window has elapsed.
minimumReleaseAgeExclude:
  - "@chitrank2050/git-hygiene-core@0.5.1"
  - "@chitrank2050/git-hygiene@0.5.1"
  - brace-expansion@1.1.19 || 1.1.20 || 1.1.21 || 2.1.5 || 2.1.6 || 2.1.7 || 5.0.10 || 5.0.11 || 5.0.12
  - smol-toml@1.8.1 || 1.9.0 || 1.9.1
  - katex@0.18.2 || 0.19.0
  - source-map-js@1.2.2
  - sharp@0.35.5
  - shell-quote@1.11.0 || 1.12.0

overrides:
  postcss: ">=8.5.23"
  esbuild: ">=0.28.1"
  js-yaml: ">=5.4.3"
  markdown-it: ">=14.3.0"
  brace-expansion@^1: "^1.1.21"
  brace-expansion@^2: "^2.1.7"
  brace-expansion@^5: "^5.0.12"
  linkify-it: ">=5.0.2"
  sharp: ">=0.35.5"
  undici: ">=7.29.0"
  katex: ">=0.18.2"
  shell-quote: ">=1.11.0"
  smol-toml: ">=1.9.0"
  source-map-js: ">=1.2.2"
