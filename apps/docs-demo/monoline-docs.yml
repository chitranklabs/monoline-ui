title: Monoline Docs
description: Write documentation in Markdown and publish a static site.
contentDirectory: ./content
assetsDirectory: ./assets
outDirectory: ./dist
base: /
appearance:
  defaultMode: system
  density: comfortable
  radius: 0.375
branding:
  favicon: /assets/favicon.svg
lang: en
stylesheet: /assets/custom.css
header:
  primaryAction:
    label: Get started
    href: /configuration
  announcement:
    text: Monoline Docs preview — Markdown, MDX and static output.
    href: /writing
  links:
    - label: Writing
      href: /writing
    - label: GitHub
      href: https://github.com/chitranklabs/monoline-ui
footer:
  text: Released under the MIT License.
  links:
    - label: Introduction
      href: /
    - label: GitHub
      href: https://github.com/chitranklabs/monoline-ui
content:
  showLastUpdated: true
  copyPageLink: true
  editLink:
    href: https://github.com/chitranklabs/monoline-ui/edit/main/apps/docs-demo/content/{path}
navigation:
  sections:
    - label: Guides
      href: /
      items:
        - label: Introduction
          href: /
        - label: Writing pages
          href: /writing
        - label: Navigation
          href: /navigation
        - label: Appearance
          href: /appearance
        - label: Search
          href: /search
        - label: Deployment
          href: /deployment
        - label: Troubleshooting
          href: /troubleshooting
        - label: Support and limitations
          href: /support
    - label: Reference
      href: /configuration
      items:
        - label: Configuration
          href: /configuration
        - label: Authoring components
          href: /components
