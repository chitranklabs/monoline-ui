title: Monoline Docs
site: https://monolinedocs.chitrankagnihotri.com
contentMounts:
  - directory: ../../docs
    route: /repository
description: Write documentation in Markdown and publish a static site.
contentDirectory: ./content
assetsDirectory: ./assets
outDirectory: ./dist
base: /
seo:
  socialImage: /assets/social.jpg
appearance:
  defaultMode: system
  density: comfortable
  radius: 0.375
branding:
  logo:
    src: /assets/favicon.svg
    alt: Monoline mark
    width: 24
    height: 24
  favicon: /assets/favicon.svg
lang: en
header:
  primaryAction:
    label: Get started
    href: /getting-started
  announcement:
    text: Built with Monoline Docs — Markdown, MDX and static output.
    href: /writing
  links:
    - label: GitHub
      href: https://github.com/chitranklabs/monoline-ui
footer:
  text: Released under the MIT License.
  links:
    - label: Created by Chitrank Agnihotri
      href: https://chitrankagnihotri.com
    - label: GitHub
      href: https://github.com/chitranklabs/monoline-ui
    - label: Support
      href: /support
content:
  showLastUpdated: true
  copyPageLink: false
navigation:
  sections:
    - label: Docs
      href: /
      items:
        - label: Introduction
          href: /
