pre-commit:
  parallel: true
  commands:
    eslint:
      glob: "*.{js,mjs,cjs,jsx,ts,tsx,mts,cts}"
      run: pnpm exec eslint --fix {staged_files}
      stage_fixed: true
    prettier:
      glob: "*.{json,css,md,yml,yaml}"
      run: pnpm exec prettier --write {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    git-hygiene:
      run: pnpm exec git-hygiene commit {1}

pre-push:
  parallel: true
  commands:
    tests:
      run: pnpm test
    branch-name:
      run: pnpm lint:branch
